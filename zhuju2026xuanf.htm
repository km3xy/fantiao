<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
  <title>悬浮打印 · 分句逐打 · 逐句朗读 + 耗时</title>
  <style>
    /* ===== 全局设计令牌 (保持不变) ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --deepseek-blue: #1752FA;
      --blue-light: #e9efff;
      --blue-soft: #d6e0ff;
      --bg-subtle: #f0f4fa;
      --surface: #ffffff;
      --text-primary: #1e293b;
      --text-secondary: #475569;
      --border-light: #dde3ed;
      --shadow-card: 0 20px 35px -10px rgba(0, 20, 50, 0.2), 0 5px 12px -4px rgba(0, 0, 0, 0.1);
      --radius-md: 18px;
      --radius-lg: 30px;
      --toolbar-bg: rgba(255,255,255,0.75);
      --toolbar-blur: blur(12px);
    }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: linear-gradient(145deg, #eef2f8 0%, #ffffff 100%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px 40px;
      position: relative;
    }

    h1 {
      color: var(--deepseek-blue);
      text-align: center;
      font-size: 2rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 20px;
      background: linear-gradient(135deg, var(--deepseek-blue) 0%, #4f7df3 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      text-shadow: 0 2px 5px rgba(23,82,250,0.1);
    }

    /* ===== 左右侧工具栏 ===== */
    .toolbar-left, .toolbar-right {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      display: flex;
      flex-direction: column;
      gap: 18px;
      background: var(--toolbar-bg);
      backdrop-filter: var(--toolbar-blur);
      -webkit-backdrop-filter: var(--toolbar-blur);
      padding: 20px 12px;
      border-radius: 60px;
      box-shadow: 0 15px 40px -8px rgba(23,82,250,0.25);
      border: 1px solid rgba(255,255,255,0.6);
      z-index: 30;
    }

    .toolbar-left {
      left: 20px;
    }

    .toolbar-right {
      right: 20px;
    }

    .tool-btn {
      width: 58px;
      height: 58px;
      border-radius: 40px;
      background: white;
      border: 2px solid var(--deepseek-blue);
      color: var(--deepseek-blue);
      font-size: 2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 10px 18px -6px rgba(23,82,250,0.3);
      user-select: none;
    }

    .tool-btn:hover {
      transform: scale(1.1);
      background: var(--deepseek-blue);
      color: white;
      border-color: white;
    }

    .tool-btn.right-btn.stopping {
      background: #dc2626;
      border-color: #dc2626;
      color: white;
    }
    .tool-btn.right-btn.stopping:hover {
      background: #b91c1c;
    }

    /* ===== 悬浮打印弹窗 (高度再次调高) ===== */
    .print-popup {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 70%;
      max-width: 1000px;
      height: 90vh;
      background: rgba(255,255,255,0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-radius: 48px;
      box-shadow: 0 40px 70px -15px rgba(0,0,0,0.4);
      border: 1px solid rgba(255,255,255,0.8);
      display: none;
      flex-direction: column;
      padding: 24px 24px 20px 24px;
      z-index: 40;
    }

    .popup-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 8px;
    }

    .popup-header h3 {
      font-size: 1.5rem;
      font-weight: 500;
      color: var(--deepseek-blue);
    }

    .popup-close {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: #f1f5f9;
      border: none;
      font-size: 2rem;
      line-height: 1;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #475569;
      transition: 0.2s;
    }
    .popup-close:hover {
      background: #e2e8f0;
      color: #0f172a;
    }

    #output {
      flex: 1;
      overflow-y: auto;
      padding: 10px 16px;
      background: rgba(255,255,255,0.5);
      border-radius: 32px;
      scrollbar-width: thin;
      font-size: 1.1rem;
      line-height: 1.6;
    }

    /* 消息样式 —— 新增句子时间戳容器 */
    .message-container {
      display: flex;
      gap: 0;
      margin-bottom: 16px;
      animation: messageSlide 0.3s ease;
      flex-direction: column;
    }
    @keyframes messageSlide {
      0% { opacity: 0.4; transform: translateY(8px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    .deepseek-avatar {
      display: none !important;
    }
    .message-content {
      flex: 1;
      background: transparent;
      padding: 4px 0;
    }
    .typewriter {
      font-size: 1.15rem;
      line-height: 1.7;
      color: #0b1f3b;
      white-space: pre-wrap;
      word-break: break-word;
      position: relative;
    }
    .typewriter::after {
      content: '▌';
      color: var(--deepseek-blue);
      font-size: 1.3rem;
      animation: cursorPulse 1.1s step-end infinite;
      margin-left: 2px;
    }
    @keyframes cursorPulse {
      0%,50% { opacity: 1; }
      51%,100% { opacity: 0.2; }
    }
    .message-time {
      font-size: 0.85rem;
      color: #4b6a92;
      text-align: left;
      margin-top: 12px;
      border-top: 1px solid #d0ddeb;
      padding-top: 8px;
      background: #f8fcff;
      border-radius: 12px;
      padding: 10px 14px;
      font-weight: 450;
      line-height: 1.5;
    }

    /* ===== 底部控制面板 ===== */
    .bottom-panel {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 24px;
      background: rgba(255,255,255,0.8);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      padding: 14px 30px;
      border-radius: 70px;
      border: 1px solid rgba(255,255,255,0.9);
      box-shadow: 0 20px 40px -12px rgba(23,82,250,0.3);
      z-index: 20;
    }

    .speed-select {
      padding: 10px 36px 10px 22px;
      font-size: 1rem;
      font-weight: 500;
      color: var(--text-primary);
      background: white url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="%231752FA" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>') no-repeat right 14px center;
      background-size: 18px;
      border: 1px solid var(--border-light);
      border-radius: 40px;
      appearance: none;
      cursor: pointer;
      min-width: 180px;
    }

    .speak-option {
      padding: 10px 28px;
      border-radius: 40px;
      background: white;
      border: 1px solid var(--border-light);
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      user-select: none;
      transition: 0.2s;
      white-space: nowrap;
    }
    .speak-option.active {
      background: var(--deepseek-blue);
      border-color: var(--deepseek-blue);
      color: white;
      box-shadow: 0 8px 16px -6px var(--deepseek-blue);
    }

    /* ===== 输入浮层 ===== */
    .input-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }

    .input-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      width: 650px;
      border-radius: 56px;
      padding: 32px 36px;
      box-shadow: 0 40px 70px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.7);
    }

    .input-card h3 {
      font-size: 2rem;
      font-weight: 500;
      color: var(--deepseek-blue);
      margin-bottom: 24px;
      padding-left: 8px;
    }

    .input-field-group {
      position: relative;
      margin-bottom: 32px;
    }

    #overlayText {
      width: 100%;
      height: 180px;
      padding: 22px 70px 22px 28px;
      border: 2px solid #d9e2ef;
      border-radius: 36px;
      font-size: 1.15rem;
      font-family: inherit;
      background: #ffffff;
      resize: vertical;
      outline: none;
      transition: 0.2s;
      box-shadow: inset 0 2px 8px rgba(0,0,0,0.02);
    }
    #overlayText:focus {
      border-color: var(--deepseek-blue);
      box-shadow: 0 0 0 5px var(--blue-soft), inset 0 2px 8px rgba(0,0,0,0.05);
    }

    .overlay-clear {
      position: absolute;
      right: 20px;
      bottom: 24px;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #ecf1f7;
      border: none;
      color: #334155;
      font-size: 2rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }
    .overlay-clear:hover {
      background: #d0dbe9;
      color: #0f172a;
    }

    .input-actions {
      display: flex;
      justify-content: flex-end;
      gap: 20px;
    }
    .input-actions button {
      padding: 16px 40px;
      border-radius: 50px;
      border: none;
      font-size: 1.2rem;
      font-weight: 500;
      cursor: pointer;
      transition: 0.2s;
    }
    .cancel-btn {
      background: #edf2f7;
      color: #475569;
    }
    .cancel-btn:hover {
      background: #dfe6f0;
    }
    .save-btn {
      background: var(--deepseek-blue);
      color: white;
      box-shadow: 0 10px 20px -6px var(--deepseek-blue);
    }
    .save-btn:hover {
      background: #0f4ad0;
    }

    /* ===== 新增耗时汇总弹窗 ===== */
    .summary-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-color: rgba(0,0,0,0.3);
      backdrop-filter: blur(6px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 200;
    }
    .summary-card {
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      width: 650px;
      max-width: 90vw;
      max-height: 80vh;
      border-radius: 56px;
      padding: 32px 36px;
      box-shadow: 0 40px 70px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.7);
      display: flex;
      flex-direction: column;
    }
    .summary-card h3 {
      font-size: 2rem;
      font-weight: 500;
      color: var(--deepseek-blue);
      margin-bottom: 24px;
      padding-left: 8px;
    }
    .summary-list {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 16px;
      background: #f8fcff;
      border-radius: 36px;
      padding: 16px 20px;
      border: 1px solid #d9e2ef;
    }
    .summary-item {
      display: flex;
      justify-content: space-between;
      padding: 10px 0;
      border-bottom: 1px dashed #cbd5e1;
      font-size: 1rem;
    }
    .summary-item:last-child {
      border-bottom: none;
    }
    .summary-sentence {
      color: #0b1f3b;
      max-width: 70%;
      word-break: break-word;
    }
    .summary-time {
      color: var(--deepseek-blue);
      font-weight: 600;
      white-space: nowrap;
      margin-left: 16px;
    }
    /* 新增总耗时样式 */
    .summary-total {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 8px 0 20px 0;
      padding: 14px 20px;
      background: var(--blue-light);
      border-radius: 40px;
      font-size: 1.2rem;
      font-weight: 600;
      border: 1px solid var(--deepseek-blue);
    }
    .summary-total-label {
      color: var(--deepseek-blue);
    }
    .summary-total-value {
      color: var(--deepseek-blue);
      background: white;
      padding: 6px 18px;
      border-radius: 40px;
      box-shadow: inset 0 1px 4px rgba(0,0,0,0.05);
    }
    .summary-close {
      align-self: flex-end;
      padding: 14px 40px;
      border-radius: 50px;
      border: none;
      font-size: 1.2rem;
      font-weight: 500;
      cursor: pointer;
      background: var(--deepseek-blue);
      color: white;
      box-shadow: 0 10px 20px -6px var(--deepseek-blue);
      transition: 0.2s;
    }
    .summary-close:hover {
      background: #0f4ad0;
    }

    @media (max-width: 900px) {
      .print-popup { width: 85%; height: 85vh; }
      .tool-btn { width: 50px; height: 50px; font-size: 1.8rem; }
      .bottom-panel { gap: 12px; padding: 12px 20px; }
    }
  </style>
</head>
<body>

  <h1>🖨️ 悬浮打印 · 左右工具栏 · 键盘音效 · 打印耗时</h1>

  <!-- 左侧工具栏 -->
  <div class="toolbar-left">
    <div class="tool-btn" id="clearInputBtn" title="清空输入内容">✕</div>
    <div class="tool-btn" id="editBtn" title="编辑内容">✎</div>
  </div>

  <!-- 右侧工具栏 (开始/停止) -->
  <div class="toolbar-right">
    <div class="tool-btn right-btn" id="startStopBtn" title="开始/停止">→</div>
  </div>

  <!-- 底部控制面板 -->
  <div class="bottom-panel">
    <select id="speedSelect" class="speed-select">
      <option value="1">⚡ 极速 (30ms)</option>
      <option value="2" selected>⚖️ 平衡 (60ms)</option>
      <option value="3">🎬 观影 (120ms)</option>
      <option value="4">🐢 慢速 (200ms)</option>
      <option value="5">🐌 超慢 (300ms)</option>
      <option value="6">⏱️ 定制 (250ms)</option>
      <option value="7">⏱️ 230ms</option>
      <option value="8">⏱️ 260ms</option>
      <option value="9">⏱️ 280ms</option>
    </select>
    <div class="speak-option active">🔊 朗读</div>
  </div>

  <!-- 悬浮打印弹窗 (高度已调高) -->
  <div class="print-popup" id="printPopup">
    <div class="popup-header">
      <h3>⌨️ 实时打印 · 每句耗时</h3>
      <button class="popup-close" id="closePopupBtn" title="关闭弹窗">✕</button>
    </div>
    <div id="output"></div>
  </div>

  <!-- 输入浮层 -->
  <div class="input-overlay" id="inputOverlay">
    <div class="input-card">
      <h3>📝 编辑内容</h3>
      <div class="input-field-group">
        <textarea id="overlayText" placeholder="写点什么吧..."></textarea>
        <button class="overlay-clear" id="overlayClear" title="清空">✕</button>
      </div>
      <div class="input-actions">
        <button class="cancel-btn" id="overlayCancel">取消</button>
        <button class="save-btn" id="overlaySave">保存 & 关闭</button>
      </div>
    </div>
  </div>

  <!-- 新增耗时汇总弹窗 (包含总耗时) -->
  <div class="summary-overlay" id="summaryOverlay">
    <div class="summary-card">
      <h3>📊 打印耗时汇总</h3>
      <div class="summary-list" id="summaryList"></div>
      <!-- 总耗时区域 -->
      <div class="summary-total">
        <span class="summary-total-label">总耗时</span>
        <span class="summary-total-value" id="summaryTotalValue">0.00 秒</span>
      </div>
      <button class="summary-close" id="summaryCloseBtn">关闭</button>
    </div>
  </div>

  <script>
    (function() {
      const DEFAULT_TEXT = "大家好，我是深梦AI。这是一个悬浮打印窗的演示，支持智能滚动、键盘音效和朗读功能。左右两侧为工具按钮，底部可调节速度。";
      if (!localStorage.getItem('typerInput')) {
        localStorage.setItem('typerInput', DEFAULT_TEXT);
      }

      class SmartTyper {
        constructor() {
          // DOM 元素
          this.output = document.getElementById('output');
          this.startStopBtn = document.getElementById('startStopBtn');
          this.clearInputBtn = document.getElementById('clearInputBtn');
          this.editBtn = document.getElementById('editBtn');
          this.speedSelect = document.getElementById('speedSelect');
          this.popup = document.getElementById('printPopup');
          this.closePopupBtn = document.getElementById('closePopupBtn');
          this.overlay = document.getElementById('inputOverlay');
          this.overlayText = document.getElementById('overlayText');
          this.overlayClear = document.getElementById('overlayClear');
          this.overlayCancel = document.getElementById('overlayCancel');
          this.overlaySave = document.getElementById('overlaySave');
          this.speakBtn = document.querySelector('.speak-option');

          // 新增汇总弹窗元素
          this.summaryOverlay = document.getElementById('summaryOverlay');
          this.summaryList = document.getElementById('summaryList');
          this.summaryTotalValue = document.getElementById('summaryTotalValue');
          this.summaryCloseBtn = document.getElementById('summaryCloseBtn');

          // 状态变量
          this.speed = 2;                     // 默认平衡
          this.isGenerating = false;
          this.lastScrollTime = 0;
          this.abortController = null;
          this.synth = window.speechSynthesis || null;
          this.isSpeak = true;
          this.speakTimeout = null;
          this.audioCtx = null;
          this.audioSupported = false;

          // 逐句朗读队列
          this.speakQueue = [];
          this.isSpeaking = false;

          // 当前文本
          this.currentText = localStorage.getItem('typerInput') || DEFAULT_TEXT;
          this.overlayText.value = this.currentText;

          // 速度映射表（增加 8:260, 9:280）
          this.speedMap = { 1:30, 2:60, 3:120, 4:200, 5:300, 6:250, 7:230, 8:260, 9:280 };

          // 存储每句耗时
          this.sentenceTimes = [];

          this.initEventListeners();

          if (!window.speechSynthesis) {
            if (this.speakBtn) this.speakBtn.style.display = 'none';
          }
        }

        // 工具函数：将文本分割为句子（保留标点）
        splitSentences(text) {
          if (!text) return [];
          const regex = /[^。！？!?]+[。！？!?]?/g;
          let matches = text.match(regex);
          if (!matches || matches.length === 0) return [text];
          return matches.map(s => s.trim()).filter(s => s.length > 0);
        }

        // 初始化事件
        initEventListeners() {
          this.speedSelect.addEventListener('change', (e) => {
            this.speed = parseInt(e.target.value);
          });

          if (this.speakBtn) {
            this.speakBtn.addEventListener('click', (e) => {
              this.isSpeak = !this.isSpeak;
              this.speakBtn.classList.toggle('active');
              if (!this.isSpeak) {
                if (this.synth) this.synth.cancel();
                this.isSpeaking = false;
                this.speakQueue = [];
                if (this.speakTimeout) clearTimeout(this.speakTimeout);
              }
            });
          }

          this.startStopBtn.addEventListener('click', () => {
            if (this.isGenerating) {
              this.abort();
            } else {
              if (this.popup.style.display !== 'flex') {
                this.popup.style.display = 'flex';
              }
              this.start();
            }
          });

          this.closePopupBtn.addEventListener('click', () => {
            this.popup.style.display = 'none';
            this.abort();
          });

          this.clearInputBtn.addEventListener('click', () => {
            this.abort();
            this.currentText = '';
            this.overlayText.value = '';
            localStorage.setItem('typerInput', '');
          });

          this.editBtn.addEventListener('click', () => {
            this.abort();
            this.overlayText.value = this.currentText;
            this.overlay.style.display = 'flex';
          });

          this.overlayClear.addEventListener('click', (e) => {
            e.stopPropagation();
            this.overlayText.value = '';
          });

          this.overlayCancel.addEventListener('click', () => {
            this.overlay.style.display = 'none';
            this.overlayText.value = this.currentText;
          });

          this.overlaySave.addEventListener('click', () => {
            this.currentText = this.overlayText.value;
            localStorage.setItem('typerInput', this.currentText);
            this.overlay.style.display = 'none';
          });

          this.overlay.addEventListener('click', (e) => {
            if (e.target === this.overlay) {
              this.overlay.style.display = 'none';
              this.overlayText.value = this.currentText;
            }
          });

          this.output.addEventListener('scroll', () => {
            this.lastScrollTime = Date.now();
          });

          // 汇总弹窗关闭按钮
          this.summaryCloseBtn.addEventListener('click', () => {
            this.summaryOverlay.style.display = 'none';
          });
          this.summaryOverlay.addEventListener('click', (e) => {
            if (e.target === this.summaryOverlay) {
              this.summaryOverlay.style.display = 'none';
            }
          });
        }

        updateStartStopIcon() {
          if (this.isGenerating) {
            this.startStopBtn.innerHTML = '⏹';
            this.startStopBtn.classList.add('stopping');
          } else {
            this.startStopBtn.innerHTML = '→';
            this.startStopBtn.classList.remove('stopping');
          }
        }

        async setupAudio() {
          if (!window.AudioContext) {
            this.audioSupported = false;
            return;
          }
          try {
            if (!this.audioCtx) {
              this.audioCtx = new AudioContext();
            }
            if (this.audioCtx.state !== 'running') {
              await this.audioCtx.resume();
            }
            this.audioSupported = true;
          } catch (e) {
            this.audioSupported = false;
          }
        }

        _playSound() {
          if (!this.audioCtx || this.audioCtx.state !== 'running') return;
          const ctx = this.audioCtx;
          const now = ctx.currentTime;
          const gainNode = ctx.createGain();
          gainNode.connect(ctx.destination);
          gainNode.gain.setValueAtTime(0, now);
          gainNode.gain.linearRampToValueAtTime(0.1, now + 0.003);
          gainNode.gain.exponentialRampToValueAtTime(0.001, now + 0.02);

          const osc1 = ctx.createOscillator();
          osc1.frequency.value = 800 + Math.random() * 300;
          osc1.type = 'sine';
          osc1.connect(gainNode);
          const osc2 = ctx.createOscillator();
          osc2.frequency.value = 1300 + Math.random() * 400;
          osc2.type = 'sine';
          osc2.connect(gainNode);

          let remaining = 2;
          const onEnded = () => {
            remaining--;
            if (remaining === 0) {
              try { gainNode.disconnect(); } catch (e) {}
            }
          };
          osc1.onended = onEnded;
          osc2.onended = onEnded;
          osc1.start(now);
          osc2.start(now);
          osc1.stop(now + 0.02);
          osc2.stop(now + 0.02);
        }

        playTypingSound() {
          if (!this.audioSupported || !this.audioCtx || this.audioCtx.state !== 'running') return;
          this._playSound();
        }

        createMessage() {
          const container = document.createElement('div');
          container.className = 'message-container';
          container.innerHTML = `<div class="deepseek-avatar"></div><div class="message-content"><div class="typewriter"></div></div>`;
          const msgContent = container.querySelector('.message-content');
          const timeDiv = document.createElement('div');
          timeDiv.className = 'message-time';
          timeDiv.style.display = 'none';
          msgContent.appendChild(timeDiv);

          if (this.output.children.length >= 20) {
            this.output.removeChild(this.output.firstElementChild);
          }
          this.output.appendChild(container);
          return container;
        }

        // 尝试播放下一个句子（队列控制）
        speakNextIfIdle() {
          if (!this.synth || !this.isSpeak) return;
          if (this.isSpeaking || this.speakQueue.length === 0) return;

          const sentence = this.speakQueue.shift();
          if (!sentence || sentence.trim() === '') {
            this.speakNextIfIdle();
            return;
          }

          this.isSpeaking = true;
          try {
            const utterance = new SpeechSynthesisUtterance(sentence);
            utterance.lang = 'zh-CN';
            utterance.rate = 1.0;
            utterance.onend = () => {
              this.isSpeaking = false;
              this.speakNextIfIdle();
            };
            utterance.onerror = () => {
              this.isSpeaking = false;
              this.speakNextIfIdle();
            };
            this.synth.speak(utterance);
          } catch (e) {
            this.isSpeaking = false;
            this.speakNextIfIdle();
          }
        }

        // 停止打印 + 清空语音队列
        abort() {
          if (this.abortController) {
            this.abortController.abort();
          }
          if (this.synth) {
            this.synth.cancel();
            this.isSpeaking = false;
            this.speakQueue = [];
          }
          if (this.speakTimeout) {
            clearTimeout(this.speakTimeout);
            this.speakTimeout = null;
          }
          this.isGenerating = false;
          this.updateStartStopIcon();
        }

        sleep(ms) {
          return new Promise(resolve => setTimeout(resolve, ms));
        }

        // 显示耗时汇总弹窗（含总耗时）
        showSummary() {
          if (this.sentenceTimes.length === 0) return;
          // 清空并填充列表
          this.summaryList.innerHTML = '';
          let total = 0;
          this.sentenceTimes.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'summary-item';
            div.innerHTML = `
              <span class="summary-sentence">${index+1}. ${item.sentence}</span>
              <span class="summary-time">${item.elapsed} 秒</span>
            `;
            this.summaryList.appendChild(div);
            total += parseFloat(item.elapsed);
          });
          // 显示总耗时（保留两位小数）
          this.summaryTotalValue.textContent = total.toFixed(2) + ' 秒';
          this.summaryOverlay.style.display = 'flex';
        }

        async start() {
          if (!this.currentText.trim()) {
            alert('请输入一些内容 (点击左侧✎编辑)');
            return;
          }

          this.popup.style.display = 'flex';

          try {
            await this.setupAudio();
          } catch (e) {}

          if (this.synth) {
            this.synth.cancel();
            this.isSpeaking = false;
            this.speakQueue = [];
          }

          // 清空上次的耗时记录
          this.sentenceTimes = [];

          this.isGenerating = true;
          this.updateStartStopIcon();
          this.abortController = new AbortController();

          try {
            await this.generate(this.currentText);
          } catch (e) {
            if (e.name !== 'AbortError') console.error(e);
          } finally {
            this.isGenerating = false;
            this.updateStartStopIcon();
          }
        }

        // 逐句生成：每个句子独立容器，打印后显示耗时，并记录到sentenceTimes
        async generate(text) {
          const sentences = this.splitSentences(text);
          const signal = this.abortController.signal;

          for (let i = 0; i < sentences.length; i++) {
            if (signal.aborted) break;

            const container = this.createMessage();
            const typewriter = container.querySelector('.typewriter');
            const timeDiv = container.querySelector('.message-time');
            timeDiv.style.display = 'none';

            const sentence = sentences[i];
            let printed = '';
            const sentenceStart = Date.now();

            for (let j = 0; j < sentence.length; j++) {
              if (signal.aborted) {
                container.remove();
                return;
              }
              printed += sentence[j];
              typewriter.textContent = printed;
              this.playTypingSound();

              this.forceReflow(typewriter);
              this.scrollToCursor(typewriter);
              await this.sleep(this.speedMap[this.speed]);
            }

            if (signal.aborted) {
              container.remove();
              return;
            }

            const elapsed = ((Date.now() - sentenceStart) / 1000).toFixed(2);
            timeDiv.textContent = `打印耗时 ${elapsed} 秒`;
            timeDiv.style.display = 'block';

            // 记录句子耗时
            this.sentenceTimes.push({ sentence, elapsed });

            if (this.isSpeak && sentence.trim().length > 0) {
              this.speakQueue.push(sentence);
              this.speakNextIfIdle();
            }
          }

          // 全部打印完毕且未被中止，显示汇总弹窗
          if (!signal.aborted && this.sentenceTimes.length > 0) {
            this.showSummary();
          }
        }

        forceReflow(element) { void element.offsetHeight; }

        scrollToCursor(element) {
          if (Date.now() - this.lastScrollTime < 800) return;
          const marker = document.createElement('span');
          marker.textContent = '|';
          marker.style.visibility = 'hidden';
          element.appendChild(marker);
          const markerRect = marker.getBoundingClientRect();
          const containerRect = this.output.getBoundingClientRect();
          element.removeChild(marker);
          const safeMargin = containerRect.height * 0.15;
          const cursorBottom = markerRect.bottom - containerRect.top + this.output.scrollTop;
          if (cursorBottom > (this.output.scrollTop + containerRect.height - safeMargin)) {
            const target = Math.min(cursorBottom - containerRect.height + safeMargin, this.output.scrollHeight - containerRect.height);
            this.smoothScroll(target);
          }
        }

        smoothScroll(target) {
          const start = this.output.scrollTop;
          const duration = 300;
          const startTime = performance.now();
          const animate = (now) => {
            const elapsed = now - startTime;
            const progress = Math.min(elapsed / duration, 1);
            const ease = 1 - Math.pow(1 - progress, 3);
            this.output.scrollTop = start + (target - start) * ease;
            if (progress < 1) requestAnimationFrame(animate);
          };
          requestAnimationFrame(animate);
        }
      }

      new SmartTyper();
    })();
  </script>
</body>
